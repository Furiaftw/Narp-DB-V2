[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  function = "serve-markdown"
  path = "/*"
  excludedPath = [
    "/assets/*",
    "/_netlify/*",
    "/.netlify/*",
    "/*.js",
    "/*.css",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.gif",
    "/*.svg",
    "/*.ico"
  ]

# Service worker must not be cached so the browser always fetches the latest version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite outputs an SPA — every unknown path should fall through to index.html
# so React handles the routing instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

[images]
  remote_images = [
    "https://cdn\\.discordapp\\.com/.*",
    "https://media\\.discordapp\\.net/.*"
  ]
