[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# dev-login is an EXPERIMENTAL_MODE-only account-minting endpoint (mints an
# owner-role account on POST). It must never ship in a production deploy,
# so it is deleted from the functions dir after build rather than relying
# solely on the env-var gate inside the function.
[context.production]
  command = "npm run build && rm -f netlify/functions/dev-login.js"

[[edge_functions]]
  function = "serve-markdown"
  path = "/*"
  excludedPath = [
    "/assets/*",
    "/_netlify/*",
    "/.netlify/*",
    "/*.js",
    "/*.css",
    "/*.png",
    "/*.jpg",
    "/*.jpeg",
    "/*.gif",
    "/*.svg",
    "/*.ico"
  ]

# Service worker must not be cached so the browser always fetches the latest version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite outputs an SPA — every unknown path should fall through to index.html
# so React handles the routing instead of returning a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The SPA shell (index.html, served here for every non-asset path via the
# rewrite above) must always be revalidated, at every caching layer, so it
# references the current deploy's hashed asset filenames. This previously
# only set Netlify-CDN-Cache-Control (the edge layer) and left the ordinary
# Cache-Control header unset, so a browser that had already cached index.html
# under the old, unset-header heuristics could keep serving it indefinitely
# even after the edge was fixed -- exactly what caused stale builds (old
# "NARP" branding, missing nav tabs) to persist on a phone across deploys.
# Cache-Control here is intentionally declared BEFORE /assets/* below: when
# two [[headers]] blocks set the same header for an overlapping path, Netlify
# uses whichever appears LAST in this file, so /assets/* still wins its own
# long-lived immutable caching despite also matching this catch-all "/*".
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[images]
  remote_images = [
    "https://cdn\\.discordapp\\.com/.*",
    "https://media\\.discordapp\\.net/.*"
  ]
